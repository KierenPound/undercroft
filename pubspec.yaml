name: undercroft
description: Multi-platform (iOS + Android) estate preparation companion app.
publish_to: 'none'
version: 1.0.0+27

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Supabase backend (shared schema + RLS + storage with FamilyPrep iOS app)
  supabase_flutter: ^2.8.0

  # State management (mirrors iOS @Observable + @EnvironmentObject)
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.6.2

  # PDF viewing (replaces iOS PDFKit)
  pdfx: ^2.8.0

  # YouTube player (replaces WKWebView + WKScriptMessageHandler bridge)
  youtube_player_iframe: ^6.0.2

  # Local storage (replaces UserDefaults / FileManager)
  shared_preferences: ^2.3.3

  # Launching URLs (web links, phone numbers)
  url_launcher: ^6.3.1

  # Biometric app lock (Face ID / Touch ID on iOS, BiometricPrompt on Android)
  local_auth: ^2.3.0

  # File & photo picking for attachments
  image_picker: ^1.1.2
  file_picker: ^8.1.2

  # Playback of the "My Video to You" clip (Supabase signed URL)
  video_player: ^2.9.2

  # Apple/Google in-app purchase for the one-off handover unlock
  in_app_purchase: ^3.2.0

  # HTTP client (works on web + mobile for PDF thumbnail downloads)
  http: ^1.2.0

  # App icon generation
  flutter_launcher_icons: ^0.13.1
  package_info_plus: ^9.0.1
  share_plus: ^12.0.2
  printing: ^5.15.1
  pdf: ^3.13.1
  cached_network_image: ^4.0.6
  flutter_cache_manager: ^3.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/defaults/
    - assets/data/test_video_list.csv

  fonts:
    - family: Caveat
      fonts:
        - asset: assets/fonts/Caveat-Regular.ttf
          weight: 400
        - asset: assets/fonts/Caveat-Medium.ttf
          weight: 500
        - asset: assets/fonts/Caveat-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Caveat-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/gravestone1.png"
  remove_alpha_ios: true
  background_color_ios: "#1A1A1A" # Set your preferred solid hex background color
